name: WorldForge core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure core on Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DWORLDFORGE_BUILD_EDITOR=OFF
      - name: Configure core on Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DWORLDFORGE_BUILD_EDITOR=OFF
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
